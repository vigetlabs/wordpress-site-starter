name: Deploy

# Each environment deploys from the branch of the same name. The branch name
# is also the GitHub environment (for approvals and per-environment variables)
# and the key into wpengine.conf for the WP Engine install name.
on:
  push:
    branches:
      - dev
      - staging
      - production
  # Redeploy a branch without a new commit: Actions tab, pick the branch.
  workflow_dispatch:

# One deploy per environment at a time. Never cancel a running one: a
# half-finished rsync is worse than a late one.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name }}
    # A manual run from any other branch would create a stray GitHub environment.
    if: contains(fromJSON('["dev", "staging", "production"]'), github.ref_name)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.target.outputs.site_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve WP Engine install
        id: target
        env:
          # Optional per-environment variable. Defaults to the install's
          # wpenginepowered.com URL. Used for the deployment link and as the
          # site licensed plugins are activated against.
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            dev|staging|production) ;;
            *)
              echo "::error::'$GITHUB_REF_NAME' is not a deployable branch. Use dev, staging or production."
              exit 1
              ;;
          esac

          # shellcheck source=../../wpengine.conf
          source ./wpengine.conf
          install_var="WPE_INSTALL_${GITHUB_REF_NAME}"
          install="${!install_var:-}"
          if [ -z "$install" ]; then
            echo "::error file=wpengine.conf::${install_var} is empty. Add the WP Engine install name for '${GITHUB_REF_NAME}'."
            exit 1
          fi

          site_url="${SITE_URL:-https://${install}.wpenginepowered.com}"
          echo "Deploying ${GITHUB_REF_NAME} to install '${install}' (${site_url%/}/)"
          {
            echo "install=${install}"
            echo "site_url=${site_url%/}/"
          } >> "$GITHUB_OUTPUT"

      - name: Build site
        uses: ./.github/actions/build-site
        with:
          site-url: ${{ steps.target.outputs.site_url }}
          secrets-json: ${{ toJSON(secrets) }}

      # Three scoped syncs rather than one wp-content/ sync. The theme is fully
      # owned by this repo, so --delete makes the install match the build and
      # clears out old hashed assets. mu-plugins/ and plugins/ sync without
      # --delete: WP Engine drops its own files into mu-plugins/, and a plugin
      # installed from wp-admin would otherwise vanish on the next deploy.
      #
      # The action's default flags exclude every dotfile, which would drop
      # dist/.vite/manifest.json and ship the theme with no CSS or JS. These
      # flags replace that with .deployignore.
      - name: Deploy theme
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ steps.target.outputs.install }}
          SRC_PATH: wp-content/themes/wp-starter/
          REMOTE_PATH: wp-content/themes/wp-starter/
          FLAGS: -azvr --inplace --delete --exclude-from=.deployignore
          CACHE_CLEAR: FALSE

      - name: Deploy mu-plugins
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ steps.target.outputs.install }}
          SRC_PATH: wp-content/mu-plugins/
          REMOTE_PATH: wp-content/mu-plugins/
          FLAGS: -azvr --inplace --exclude-from=.deployignore
          CACHE_CLEAR: FALSE

      - name: Deploy plugins and clear cache
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ steps.target.outputs.install }}
          SRC_PATH: wp-content/plugins/
          REMOTE_PATH: wp-content/plugins/
          FLAGS: -azvr --inplace --exclude-from=.deployignore
          CACHE_CLEAR: TRUE
