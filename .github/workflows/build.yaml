name: Build Theme

on:
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: wp-content/themes/wp-starter/package-lock.json

      - name: Use npm 11
        run: |
          npm install -g npm@11
          npm --version

      # Set up composer caching
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      # This check has no deploy target, so licensed plugins are activated
      # against the local ddev URL - a free, unlimited dev activation. Set the
      # LICENSE_SITE_URL repository variable to override.
      - name: Resolve license site URL
        id: license
        run: |
          set -euo pipefail
          site_url="${LICENSE_SITE_URL:-}"
          if [ -z "$site_url" ]; then
            project="$(sed -n 's/^name: *//p' .ddev/config.yaml | head -1)"
            site_url="https://$project.ddev.site"
          fi
          echo "Licensing against ${site_url%/}/"
          echo "site_url=${site_url%/}/" >> "$GITHUB_OUTPUT"
        env:
          LICENSE_SITE_URL: ${{ vars.LICENSE_SITE_URL }}

      # Build theme
      - name: Install Theme Dependencies
        uses: ./.github/actions/composer-install
        with:
          working-directory: wp-content/themes/wp-starter
          site-url: ${{ steps.license.outputs.site_url }}
          secrets-json: ${{ toJSON(secrets) }}

      - name: Build Theme
        run: |
          npm ci
          npm run build
        working-directory: wp-content/themes/wp-starter

      # Install viget-wp composer dependencies
      - name: Install viget-wp Dependencies
        uses: ./.github/actions/composer-install
        with:
          working-directory: wp-content/mu-plugins/viget-wp

      - name: Build Success
        run: echo "✅ Theme build completed successfully!"
