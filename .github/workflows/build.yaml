name: Build Theme

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
      - production

concurrency:
  group: build-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check versions and event handlers
        run: |
          set -euo pipefail
          if [ -f bin/sync-version.mjs ]; then
            node bin/sync-version.mjs --check
          fi
          php bin/check-event-handlers.php

      # This check has no deploy target, so licensed plugins are activated
      # against the local ddev URL - a free, unlimited dev activation. Set the
      # LICENSE_SITE_URL repository variable to override.
      - name: Resolve license site URL
        id: license
        run: |
          set -euo pipefail
          site_url="${LICENSE_SITE_URL:-}"
          if [ -z "$site_url" ]; then
            project="$(sed -n 's/^name: *//p' .ddev/config.yaml | head -1)"
            site_url="https://$project.ddev.site"
          fi
          echo "Licensing against ${site_url%/}/"
          echo "site_url=${site_url%/}/" >> "$GITHUB_OUTPUT"
        env:
          LICENSE_SITE_URL: ${{ vars.LICENSE_SITE_URL }}

      # Same steps the deploy workflow runs, so a green check here means the
      # branch will build when it is deployed.
      - name: Build site
        uses: ./.github/actions/build-site
        with:
          site-url: ${{ steps.license.outputs.site_url }}
          secrets-json: ${{ toJSON(secrets) }}

      - name: Build Success
        run: echo "✅ Theme build completed successfully!"
