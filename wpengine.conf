# WP Engine environment map for this project.
#
# Consumed by:
#   - .ddev/commands/host/db-sync     (`ddev db-sync`)
#   - .github/workflows/deploy.yaml   (branch deploys: the branch name is the environment name)
#
# Sourced by bash, so use plain KEY="value" assignments only. Environment names
# build variable names, so keep them to [A-Za-z0-9_]. Install names are not
# secret - credentials come from SSH keys, never from this file.

# Environments offered by `ddev db-sync`, in menu order. Add "production" here
# once that install exists.
WPE_ENVIRONMENTS="dev staging"

# Install name per environment: WPE_INSTALL_<environment>.
# Find these in the WP Engine User Portal - they're the install names, e.g. "acmedev".
# `ddev db-sync` fails with a pointer here until they're filled in, and the
# deploy workflow reads WPE_INSTALL_<branch> for pushes to dev, staging and
# production.
WPE_INSTALL_dev=""
WPE_INSTALL_staging=""
WPE_INSTALL_production=""

# Plugins `ddev db-sync` deactivates locally after an import, because they're
# active on the remote but can't boot locally. SearchWP is the usual one - its
# bundled `lib/vendor/` is gitignored, so WordPress fatals if it's missing.
# Space-separated; leave empty to disable.
WPE_LOCAL_DEACTIVATE_PLUGINS=""
